name: SonarCloud Analysis

on:
  push:
    branches:
      - main

  pull_request:
    types: [opened, synchronize, reopened]

jobs:

  analyze:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - provider-service
          - schedule-service
          - appointment-service
          - payment-service
          - review-service
          - notification-service
          - record-service
          - eureka-server

    name: Analyze ${{ matrix.service }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Build and Analyze
        working-directory: ${{ matrix.service }}

        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

        run: |
          mvn -B clean install -DskipTests sonar:sonar \
          -Dsonar.projectKey=harshita3459_${{ matrix.service }} \
          -Dsonar.organization=harshita3459