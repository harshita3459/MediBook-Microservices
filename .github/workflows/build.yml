name: SonarCloud Analysis

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  analyze:
    runs-on: ubuntu-latest
    name: Analyze ${{ matrix.service }}

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - provider-service
          - schedule-service
          - appointment-service
          - payment-service
          - review-service
          - notification-service
          - record-service
          - eureka-server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      - name: Show discovered test files
        working-directory: ${{ matrix.service }}
        run: |
          find src/test/java -name "*Test.java" -print || true

      - name: Build, Test and Analyze
        working-directory: ${{ matrix.service }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B clean verify sonar:sonar \
            -Dsonar.projectKey=harshita3459_${{ matrix.service }} \
            -Dsonar.organization=harshita3459 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token="${SONAR_TOKEN}"

      - name: Show test reports
        if: always()
        working-directory: ${{ matrix.service }}
        run: |
          find target/surefire-reports -type f -name "*.txt" -print -exec cat {} \; || true
