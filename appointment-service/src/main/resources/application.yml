server:
  port: 8084

spring:
  application:
    name: appointment-service
  cache:
    type: redis
  datasource:
    url: jdbc:mysql://localhost:3306/appointment_db?serverTimezone=Asia/Kolkata
    username: root
    password: hag11990
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata

  jackson:
    time-zone: Asia/Kolkata
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

# Shared JWT secret — must match auth-service exactly
jwt:
  secret: medibook-super-secret-key-must-be-at-least-256-bits-long-for-hs256

# URLs of other microservices this service calls
services:
  schedule-url:     http://localhost:8080/internal/slots
  payment-url:      http://localhost:8080/api/v1/payments
  notification-url: http://localhost:8080/internal/notifications
  provider-url:     http://localhost:8080/api/v1/providers

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.medibook.appointment: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
