server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              "[/**]":
                allowedOriginPatterns:
                  - "http://localhost:3000"
                  - "http://localhost:5173"
                  - "http://localhost:*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          routes:
            - id: auth-public
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/login,/api/v1/auth/register,/api/v1/auth/refresh,/api/v1/auth/validate

            - id: auth-protected
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - name: JwtAuthFilter

            - id: provider-internal-rating
              uri: http://localhost:8082
              predicates:
                - Path=/internal/providers/{id}/rating
                - Method=PUT
              filters:
                - RewritePath=/internal/providers/(?<id>[^/]+)/rating,/api/v1/providers/$\{id}/rating

            - id: provider-public
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/providers
                - Method=GET

            - id: provider-public-search
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/providers/search,/api/v1/providers/specialization/**,/api/v1/providers/city/**,/api/v1/providers/top-rated,/api/v1/providers/fee-range,/api/v1/providers/{id}
                - Method=GET

            - id: provider-protected
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/providers/**
              filters:
                - name: JwtAuthFilter

            - id: schedule-internal
              uri: http://localhost:8083
              predicates:
                - Path=/internal/slots/{id}/book,/internal/slots/{id}/release
                - Method=PUT
              filters:
                - RewritePath=/internal/slots/(?<id>[^/]+)/(?<action>book|release),/api/v1/slots/$\{id}/$\{action}

            - id: schedule-public
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/slots/available,/api/v1/slots/available/**,/api/v1/slots/{id}
                - Method=GET

            - id: schedule-protected
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/slots/**
              filters:
                - name: JwtAuthFilter

            - id: appointment-internal
              uri: http://localhost:8084
              predicates:
                - Path=/internal/appointments/{id}
                - Method=GET
              filters:
                - AddRequestHeader=X-Internal-Call,true
                - RewritePath=/internal/appointments/(?<id>[^/]+),/api/v1/appointments/$\{id}

            - id: appointment-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/appointments/**
              filters:
                - name: JwtAuthFilter

            - id: payment-webhook
              uri: http://localhost:8085
              predicates:
                - Path=/api/v1/payments/*/status
                - Method=PUT

            - id: payment-protected
              uri: http://localhost:8085
              predicates:
                - Path=/api/v1/payments/**
              filters:
                - name: JwtAuthFilter

            - id: review-public
              uri: http://localhost:8086
              predicates:
                - Path=/api/v1/reviews/provider/**
                - Method=GET

            - id: review-protected
              uri: http://localhost:8086
              predicates:
                - Path=/api/v1/reviews/**
              filters:
                - name: JwtAuthFilter

            - id: notification-internal
              uri: http://localhost:8087
              predicates:
                - Path=/internal/notifications,/internal/notifications/appointment-event,/internal/notifications/payment-event
                - Method=POST
              filters:
                - RewritePath=/internal/notifications(?<segment>/?.*),/api/v1/notifications$\{segment}

            - id: notification-events
              uri: http://localhost:8087
              predicates:
                - Path=/api/v1/notifications/appointment-event,/api/v1/notifications/payment-event
                - Method=POST

            - id: notification-protected
              uri: http://localhost:8087
              predicates:
                - Path=/api/v1/notifications/**
              filters:
                - name: JwtAuthFilter

            - id: record-service
              uri: http://localhost:8088
              predicates:
                - Path=/api/v1/records/**
              filters:
                - name: JwtAuthFilter

            - id: gateway-health
              uri: http://localhost:8080
              predicates:
                - Path=/actuator/**

jwt:
  secret: medibook-super-secret-key-must-be-at-least-256-bits-long-for-hs256

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.medibook.gateway: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway, routes
  endpoint:
    gateway:
      access: read-only

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true